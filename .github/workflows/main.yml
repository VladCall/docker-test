name: cissws


on:
  push:
    branches:
      - "main"


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: docker build
        run: docker build -t my-base-container .
      - name: docker run
        run: docker run -it --privileged -v /var/run/docker.sock:/var/run/docker.sock my-base-container
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: create volume
        run: docker volume create build
      - name: docker-compose build
        run: docker-compose build
      - name: docker-compose up db redis
        run: docker-compose up -d db redis 
      - name: docker-compose up dev
        run: docker-compose up -d dev
      - name: docker-compose folders
        run: ls -l
